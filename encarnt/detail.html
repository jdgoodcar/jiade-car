<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- 預覽期間不讓 Google 收錄；正式上線時移除 -->
<title>車輛詳情 | 佳德汽車 Encar 線上選車</title>
<meta name="theme-color" content="#16244a">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../favicon.png">
<link rel="preconnect" href="https://api.encar.com" crossorigin>
<link rel="preconnect" href="https://ci.encar.com">
<link rel="stylesheet" href="assets/css/encarnt.css?v=21">
<script type="module" src="assets/js/detail.js?v=21"></script>
</head>
<body>
<header class="hd">
  <div class="wrap">
    <div class="brand"><a href="./" aria-label="回到選車列表"><img src="../logo.png" alt="佳德汽車" width="104" height="26"></a><b>Encar 線上選車</b></div>
    <span class="sp"></span>
  </div>
</header>

<main class="wrap">
  <button class="back" id="back" type="button">‹ 返回車輛列表</button>
  <div id="app">
    <div class="dt">
      <div><div class="gal sk"><div class="ph" style="aspect-ratio:4/3"></div></div></div>
      <div class="side"><div class="card sk"><div class="ln" style="width:70%"></div><br><div class="ln" style="width:50%;height:30px"></div></div></div>
    </div>
  </div>
</main>

<button type="button" class="totop" id="toTop" aria-label="回到最上面" title="回到最上面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5 20 17.5H4z" stroke="#f3cf7a" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
<!-- 電腦版分享：顯示 QR Code 讓手機掃描 -->
<div class="sheet" id="qrSheet" hidden>
  <div class="box qrbox" role="dialog" aria-modal="true" aria-labelledby="qrT">
    <div class="top"><h2 id="qrT">用手機掃描，開啟這台車</h2><button class="x" id="qrX" type="button" aria-label="關閉">×</button></div>
    <div class="in">
      <div class="qrimg" id="qrImg"></div>
      <p class="fine" style="text-align:center">打開手機相機對準 QR Code，就能在手機上查看這台車、分享給朋友或用 LINE 詢問。</p>
      <button class="btn-m" id="qrCopy" type="button">複製這台車的連結</button>
    </div>
  </div>
</div>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <button class="shr" id="share" type="button" aria-label="分享這台車" title="分享這台車"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <a class="enc" id="encLink" href="#" target="_blank" rel="noopener"><span>Encar</span><span>原始頁面 ↗</span></a>
    <button class="btn-line" id="askLine" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8Z"/></svg><span class="lt">LINE 詢問這台<small>自動複製車輛資訊，貼上即可</small></span></button>
  </div>
</div>
</body>
</html>
